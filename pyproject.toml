[project]
name = "voapi2plusplus"
version = "0.1.0"
description = "Dependency-aware API vulnerability fuzzing framework"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "faker==40.12.0",
    "google-genai>=1.56.0",
    "instructor==1.13.0",
    "jsonref==1.1.0",
    "lark==1.1.9",
    "numpy==2.2.6",
    "openai==2.14.0",
    "playwright==1.49.1",
    "pydantic==2.12.5",
    "python-dotenv==1.0.1",
    "pyyaml==6.0.2",
    "requests==2.32.5",
    "requests-toolbelt==1.0.0",
    "symspellpy==6.9.0",
    "tenacity==9.0.0",
    "tqdm==4.66.5",
    "tree-sitter==0.24.0",
    "tree-sitter-go==0.23.4",
    "tree-sitter-java==0.23.5",
    "tyro==1.0.11",
    "urllib3==2.2.3",
]

[project.optional-dependencies]
analysis = [
    "matplotlib==3.10.3",
]
gemini = [
    "google-genai==1.56.0",
]
legacy = [
    "json-ref-dict",
    "pyopenssl",
]

[dependency-groups]
dev = [
    "pytest==8.3.4",
    "sqlmap>=1.10.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
markers = [
    "browser: runs local Chromium integration tests (requires Playwright Chromium)",
]
testpaths = [
    "tests",
]
